[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onenote-to-markdown"
version = "0.1.0"
description = "Read Microsoft OneNote .one section files (OneDrive / SharePoint packaging) and export them to organized Markdown — pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "David Furman" }]
keywords = ["onenote", "markdown", "onedrive", "export", "converter", "ms-onestore", "fsshttpb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.12; python_version >= '3.10'"]
dev = ["pytest>=7", "anthropic>=1.12; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/rans0r/onenote-to-markdown"
Issues = "https://github.com/rans0r/onenote-to-markdown/issues"

[tool.setuptools]
packages = ["onenote_to_markdown", "onenote_to_markdown.tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
